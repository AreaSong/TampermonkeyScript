<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AreaSong 题库</title>
  <style>
    :root {
      --ink: #303133;
      --muted: #909399;
      --line: #e4e7ed;
      --paper: #f5f7fa;
      --accent: #409eff;
      --ok: #67c23a;
      --bad: #f56c6c;
      --type-0: #409eff;
      --type-1: #e6a23c;
      --type-2: #9b59b6;
      --type-3: #67c23a;
      --type-4: #13c2c2;
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html, body { height: 100%; }
    body {
      margin: 0;
      overflow: hidden;
      color: var(--ink);
      background: var(--paper);
      font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    }
    main {
      display: grid;
      grid-template-rows: auto auto minmax(0, 1fr);
      height: 100%;
    }
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 18px;
      background: #fff;
      border-bottom: 1px solid var(--line);
    }
    h1 { margin: 0; font-size: 18px; font-weight: 650; }
    .lede { margin: 2px 0 0; color: var(--muted); font-size: 12px; }
    .modebar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 10px 18px 0;
      background: #fff;
    }
    .mode-tabs, .toolbar, .actions, .type-tabs, .filters, .pager {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }
    .mode-cluster {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .mode-tabs button {
      border: 0;
      border-radius: 16px;
      padding: 7px 16px;
      background: transparent;
      color: #606266;
      font-weight: 600;
      cursor: pointer;
    }
    .mode-tabs button[aria-pressed="true"] { background: #ecf5ff; color: var(--accent); }
    #add-question {
      border-radius: 16px;
      padding: 7px 14px;
    }
    button, .file-btn {
      border: 0;
      border-radius: 4px;
      padding: 8px 16px;
      background: var(--accent);
      color: #fff;
      font-weight: 600;
      cursor: pointer;
    }
    button.ghost, .file-btn { background: #fff; color: #606266; border: 1px solid #dcdfe6; }
    button.danger { background: var(--bad); color: #fff; }
    button.tiny { padding: 4px 10px; font-size: 12px; }
    button.link {
      background: transparent;
      color: var(--accent);
      padding: 0;
      font-weight: 500;
    }
    .workspace {
      min-height: 0;
      display: flex;
      flex-direction: column;
      padding: 12px 18px 16px;
      background: #fff;
    }
    .workspace > * { flex: 1; min-height: 0; }
    .split {
      display: grid;
      grid-template-columns: 1fr 1fr;
      height: 100%;
      border: 1px solid var(--line);
    }
    .pane {
      min-width: 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
      position: relative;
      background: #fff;
    }
    .pane + .pane { border-left: 1px solid var(--line); }
    .pane-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      background: #f2f3f5;
      font-size: 15px;
      font-weight: 650;
    }
    .pane-tools { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
    .count-zero { color: var(--bad); }
    .count-ok { color: var(--ok); }
    .pane-body { min-height: 0; flex: 1; position: relative; overflow: auto; }
    .watermark::after {
      content: attr(data-mark);
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 72px;
      font-weight: 700;
      color: rgba(0, 0, 0, 0.06);
      pointer-events: none;
    }
    #batch-input {
      width: 100%;
      height: 100%;
      border: 0;
      resize: none;
      padding: 12px 14px 16px;
      font: 14px/1.7 ui-monospace, SFMono-Regular, Menlo, "PingFang SC", sans-serif;
      background: transparent;
    }
    #batch-input:focus { outline: 0; }
    .pane-tools .detect {
      background: var(--accent);
      color: #fff;
      border: 0;
      padding: 5px 12px;
      font-size: 13px;
    }
    .preview { padding: 10px 12px 16px; }
    .type-tabs { margin: 0 0 12px; }
    .type-tabs button[data-type="0"], .filters button[data-filter="0"] { color: var(--type-0); background: #ecf5ff; }
    .type-tabs button[data-type="1"], .filters button[data-filter="1"] { color: #b88230; background: #fdf6ec; }
    .type-tabs button[data-type="2"], .filters button[data-filter="2"] { color: var(--type-2); background: #f5eefb; }
    .type-tabs button[data-type="3"], .filters button[data-filter="3"] { color: #529b2e; background: #f0f9eb; }
    .type-tabs button[data-type="4"], .filters button[data-filter="4"] { color: var(--type-4); background: #e6fffb; }
    .type-tabs button[aria-pressed="true"],
    .filters button[aria-pressed="true"] { color: #fff; }
    .type-tabs button[data-type="0"][aria-pressed="true"],
    .filters button[data-filter="0"][aria-pressed="true"] { background: var(--type-0); }
    .type-tabs button[data-type="1"][aria-pressed="true"],
    .filters button[data-filter="1"][aria-pressed="true"] { background: var(--type-1); }
    .type-tabs button[data-type="2"][aria-pressed="true"],
    .filters button[data-filter="2"][aria-pressed="true"] { background: var(--type-2); }
    .type-tabs button[data-type="3"][aria-pressed="true"],
    .filters button[data-filter="3"][aria-pressed="true"] { background: var(--type-3); }
    .type-tabs button[data-type="4"][aria-pressed="true"],
    .filters button[data-filter="4"][aria-pressed="true"] { background: var(--type-4); }
    .filters button { padding: 6px 10px; font-size: 12px; background: #f4f4f5; color: var(--ink); }
    .filters button[data-filter="all"][aria-pressed="true"] { color: #fff; background: var(--accent); }
    label { display: block; margin: 0 0 6px; font-size: 13px; font-weight: 600; }
    input, textarea, select {
      width: 100%;
      margin: 0;
      padding: 8px 10px;
      border: 1px solid #dcdfe6;
      border-radius: 4px;
      background: #fff;
      color: var(--ink);
      font: inherit;
      font-size: 14px;
    }
    textarea { min-height: 72px; resize: vertical; }
    .field { margin-bottom: 12px; }
    .rule {
      margin: 0 0 12px;
      padding: 8px 10px;
      background: #f4f4f5;
      color: #606266;
      font-size: 13px;
      line-height: 1.55;
    }
    .option-row, .blank-row {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      gap: 8px;
      align-items: center;
      margin-bottom: 8px;
    }
    .judge-row {
      display: grid;
      gap: 8px;
      margin-bottom: 12px;
    }
    .judge-option {
      display: flex;
      gap: 10px;
      align-items: center;
      padding: 8px 10px;
      border: 1px solid #ebeef5;
      border-radius: 4px;
      background: #fff;
      cursor: pointer;
    }
    .judge-option input {
      width: auto;
      margin: 0;
      accent-color: var(--ok);
    }
    .judge-option:has(input:checked) {
      border-color: #c2e7b0;
      background: #f0f9eb;
      color: #529b2e;
    }
    .judge-option:has(input:checked) .choice-letter {
      border-color: var(--ok);
      background: var(--ok);
      color: #fff;
    }
    .bank {
      min-height: 0;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .bank-toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
    .bank-toolbar .field { margin: 0; min-width: 200px; max-width: none; flex: 1; }
    .probe-bar { display: flex; gap: 8px; align-items: center; }
    .probe-bar .field { margin: 0; flex: 1; min-width: 200px; }
    .probe-result {
      margin: 0;
      padding: 8px 10px;
      border-radius: 4px;
      font-size: 13px;
      line-height: 1.5;
      display: grid;
      gap: 2px;
      cursor: pointer;
      text-align: left;
      width: 100%;
    }
    .probe-result[hidden] { display: none !important; }
    .probe-result.is-hit { background: #f0f9eb; color: #529b2e; border: 1px solid #c2e7b0; }
    .probe-result.is-miss { background: #fef0f0; color: #c45656; border: 1px solid #fbc4c4; }
    .probe-result strong { font-size: 13px; }
    .bank-body {
      min-height: 0;
      flex: 1;
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 12px;
    }
    .bank-body.is-editing { grid-template-columns: min(420px, 40%) minmax(0, 1fr); }
    .bank-editor {
      min-height: 0;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: 12px;
      background: #fafafa;
    }
    .bank-editor-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }
    .bank-editor .single {
      flex: 1;
      min-height: 0;
      height: auto;
      max-width: none;
      margin: 0;
      padding: 0;
      overflow: auto;
    }
    .bank-editor .actions {
      position: sticky;
      bottom: 0;
      background: #fafafa;
      padding: 10px 0 0;
      align-items: center;
    }
    .bank-editor .actions .status {
      flex: 1 1 100%;
      margin: 0;
    }
    .list {
      min-height: 0;
      overflow: auto;
      display: grid;
      gap: 6px;
      align-content: start;
      width: 100%;
      padding-bottom: 16px;
    }
    .item {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 4px;
      background: #fff;
    }
    .list .item {
      gap: 0;
      padding: 0;
    }
    .bank-row {
      display: flex;
      gap: 8px;
      align-items: flex-start;
      padding: 8px 10px;
      cursor: pointer;
    }
    .bank-main {
      flex: 1;
      min-width: 0;
      display: grid;
      gap: 2px;
    }
    .bank-title {
      display: -webkit-box;
      overflow: hidden;
      font-size: 14px;
      line-height: 1.45;
      font-weight: 600;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
    }
    .list .item.is-open .bank-title { -webkit-line-clamp: unset; }
    .bank-answer {
      min-width: 0;
      overflow: hidden;
      color: #529b2e;
      font-size: 13px;
      line-height: 1.4;
      white-space: nowrap;
      text-overflow: ellipsis;
    }
    .bank-row .actions { flex: none; }
    .list .item .choices {
      display: none;
      padding: 0 10px 10px;
    }
    .list .item.is-open .choices { display: grid; }
    .list .item.is-editing { border-color: var(--accent); }
    .list .item.is-probe { border-color: var(--ok); background: #f8fdf5; }
    .list .item.is-probe-near { border-color: var(--bad); background: #fff8f8; }
    .item.type-0 { border-left: 3px solid var(--type-0); }
    .item.type-1 { border-left: 3px solid var(--type-1); }
    .item.type-2 { border-left: 3px solid var(--type-2); }
    .item.type-3 { border-left: 3px solid var(--type-3); }
    .item.type-4 { border-left: 3px solid var(--type-4); }
    .item-head { display: flex; gap: 8px; align-items: flex-start; }
    .item-head b { flex: 1; min-width: 0; font-size: 14px; line-height: 1.55; font-weight: 600; }
    .type-badge {
      flex: none;
      padding: 1px 8px;
      border-radius: 2px;
      font-size: 12px;
      font-weight: 700;
      line-height: 18px;
      color: #fff;
    }
    .type-0 .type-badge { background: var(--type-0); }
    .type-1 .type-badge { background: var(--type-1); }
    .type-2 .type-badge { background: var(--type-2); }
    .type-3 .type-badge { background: var(--type-3); }
    .type-4 .type-badge { background: var(--type-4); }
    .choices { display: grid; gap: 6px; }
    .choice {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      padding: 7px 10px;
      border: 1px solid #ebeef5;
      border-radius: 4px;
      font-size: 13px;
      line-height: 1.45;
    }
    .choice.is-answer { border-color: #c2e7b0; background: #f0f9eb; color: #529b2e; }
    .choice-letter {
      flex: none;
      width: 22px;
      height: 22px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid #c0c4cc;
      border-radius: 50%;
      font-size: 12px;
      font-weight: 700;
    }
    .choice.is-answer .choice-letter { border-color: var(--ok); background: var(--ok); color: #fff; }
    .choice-text { min-width: 0; flex: 1; }
    .essay-answer {
      padding: 8px 10px;
      border-left: 3px solid var(--ok);
      background: #f0f9eb;
      color: #529b2e;
      font-size: 13px;
      line-height: 1.55;
      white-space: pre-wrap;
    }
    .hint { margin: 8px 0; color: var(--muted); font-size: 13px; }
    .status { min-height: 16px; margin: 6px 0 0; font-size: 12px; }
    .status.ok { color: var(--ok); }
    .status.bad { color: var(--bad); }
    .pager { justify-content: space-between; margin-top: 8px; color: var(--muted); font-size: 12px; }
    .pager-meta { display: flex; gap: 12px; align-items: center; min-width: 0; }
    .pager-meta .status { margin: 0; }
    .modal {
      position: fixed;
      inset: 0;
      display: none;
      place-items: center;
      background: rgba(0, 0, 0, 0.35);
      z-index: 20;
      padding: 24px;
    }
    .modal.open { display: grid; }
    .modal-card {
      width: min(720px, 100%);
      max-height: 80vh;
      overflow: auto;
      background: #fff;
      border-radius: 4px;
      padding: 18px 20px;
    }
    .modal-card h3 { margin: 0 0 12px; }
    .help-box { background: #ecf5ff; padding: 12px 14px; margin: 0 0 14px; font-size: 13px; line-height: 1.7; }
    .sample { font-size: 13px; line-height: 1.7; white-space: pre-wrap; }
    .sample b { color: var(--ok); }
    @media (max-width: 900px) {
      body { overflow: auto; }
      main { height: auto; grid-template-rows: auto; }
      .split { grid-template-columns: 1fr; height: 70vh; }
      .pane + .pane { border-left: 0; border-top: 1px solid var(--line); }
    }
  </style>
</head>
<body>
  <main>
    <header class="topbar">
      <div>
        <h1>AreaSong 题库</h1>
        <p class="lede">批量粘贴走导入；单题新增和编辑在「当前题库」。</p>
      </div>
      <p class="status" id="status"></p>
    </header>
    <div class="modebar">
      <div class="mode-cluster">
        <div class="mode-tabs" id="mode-tabs">
          <button type="button" data-mode="batch" aria-pressed="true">批量导入</button>
          <button type="button" data-mode="bank" id="bank-tab">当前题库</button>
        </div>
        <button type="button" id="add-question" hidden>新增题目</button>
      </div>
      <button type="button" id="commit">录入试题</button>
    </div>
    <section class="workspace">
      <div class="split" id="batch-view">
        <section class="pane">
          <div class="pane-head">
            <span>输入区：</span>
            <div class="pane-tools">
              <button type="button" class="link" id="quick-input">快捷输入</button>
              <button type="button" class="link" id="show-help">格式案例说明</button>
              <button type="button" class="ghost tiny" id="clear-input">清空</button>
              <button type="button" class="detect" id="detect">识别格式</button>
            </div>
          </div>
          <div class="pane-body watermark" id="input-pane" data-mark="输入区">
            <textarea id="batch-input" spellcheck="false" placeholder="1.先查看格式说明后，再行录入
2.支持题型：单选、多选、判断、填空、简答
3.粘贴后会自动识别，也可点右上角「识别格式」"></textarea>
          </div>
        </section>
        <section class="pane">
          <div class="pane-head">
            <span>检查区：</span>
            <span id="preview-count">总计输入 <b class="count-zero">0</b> 道</span>
          </div>
          <div class="pane-body watermark" id="preview-pane" data-mark="检查区">
            <div class="preview" id="preview"></div>
          </div>
        </section>
      </div>
      <form class="single" id="form" hidden>
        <div class="type-tabs" id="type-tabs">
          <button type="button" data-type="0" aria-pressed="true">单选</button>
          <button type="button" data-type="1">多选</button>
          <button type="button" data-type="3">判断</button>
          <button type="button" data-type="2">填空</button>
          <button type="button" data-type="4">简答</button>
        </div>
        <p class="rule" id="rule"></p>
        <label for="title">题干</label>
        <textarea id="title" class="field" placeholder="把完整题干贴在这里"></textarea>
        <div id="type-fields"></div>
        <div class="actions">
          <button type="submit" id="form-submit">保存</button>
          <button type="button" class="ghost" id="reset">清空</button>
          <p class="status" id="editor-status"></p>
        </div>
      </form>
      <section class="bank" id="bank-view" hidden>
        <div class="bank-toolbar">
          <div class="filters" id="type-filters">
            <button type="button" data-filter="all" aria-pressed="true">全部</button>
            <button type="button" data-filter="0">单选</button>
            <button type="button" data-filter="1">多选</button>
            <button type="button" data-filter="3">判断</button>
            <button type="button" data-filter="2">填空</button>
            <button type="button" data-filter="4">简答</button>
          </div>
          <input id="search" class="field" placeholder="搜索题干、选项或答案">
        </div>
        <div class="probe-bar">
          <input id="probe-input" class="field" placeholder="把考试里看到的题干贴这里，试搜会不会命中">
          <button type="button" id="probe">试搜</button>
        </div>
        <button type="button" class="probe-result" id="probe-result" hidden></button>
        <div class="bank-body" id="bank-body">
          <aside class="bank-editor" id="bank-editor" hidden>
            <div class="bank-editor-head">
              <strong id="editor-heading">编辑题目</strong>
              <button type="button" class="ghost tiny" id="close-editor">取消</button>
            </div>
          </aside>
          <div class="list" id="list"></div>
        </div>
        <div class="pager">
          <div class="pager-meta">
            <span id="page-info">共 0 题</span>
            <span class="status" id="bank-status"></span>
          </div>
          <div class="actions">
            <button type="button" class="ghost tiny" id="expand-all">全部展开</button>
            <button type="button" class="ghost tiny" id="collapse-all">全部收起</button>
          </div>
        </div>
      </section>
    </section>
  </main>
  <div class="modal" id="help-modal">
    <div class="modal-card">
      <div class="toolbar" style="justify-content:space-between">
        <h3>格式案例说明</h3>
        <button type="button" class="ghost tiny" id="close-help">关闭</button>
      </div>
      <div class="help-box">
        1. 试题需要有序号，支持：1. 或 1、<br>
        2. 答案、解析后面要有冒号，如：答案：<br>
        3. 选项后面需要点或顿号，如：A. 或 A、<br>
        4. 答案另起一行，如：答案：A<br>
        5. 填空题有多个答案用 | 隔开，如：春 | 夏 | 秋<br>
        6. 判断题支持：正确、错误、对、错<br>
        7. 简答题答案请写在一行
      </div>
      <div class="sample" id="help-sample"></div>
    </div>
  </div>
  <script src="/exam-parse.js"></script>
  <script>
    const LETTERS = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
    const MODES = new Set(["batch", "bank"]);
    const startWithNew = location.hash.slice(1) === "single";
    const readMode = () => {
      const hash = location.hash.slice(1);
      if (hash === "single") return "bank";
      return MODES.has(hash) ? hash : "batch";
    };
    const typeName = { "0": "单选", "1": "多选", "2": "填空", "3": "判断", "4": "简答" };
    const rules = {
      "0": "单选：可添加任意个选项，点左侧圆点标记唯一正确答案。",
      "1": "多选：可添加任意个选项，勾选所有正确项。",
      "3": "判断：点选正确或错误。",
      "2": "填空：一空一行，空不够就点添加空。",
      "4": "简答：直接写参考答案全文。"
    };
    const state = {
      mode: readMode(),
      type: "0",
      options: [{ text: "", correct: true }, { text: "", correct: false }],
      blanks: [""],
      judge: "正确",
      essay: "",
      preview: [],
      questions: [],
      query: "",
      filterType: "all",
      open: new Set(),
      editing: null,
      dirty: false,
      probeIndex: null,
      probeHit: false
    };

    const fields = document.querySelector("#type-fields");
    const form = document.querySelector("#form");
    const bankBody = document.querySelector("#bank-body");
    const bankEditor = document.querySelector("#bank-editor");
    const status = document.querySelector("#status");
    const editorStatus = document.querySelector("#editor-status");
    const bankStatus = document.querySelector("#bank-status");
    const list = document.querySelector("#list");
    const batchInput = document.querySelector("#batch-input");
    const preview = document.querySelector("#preview");
    const inputPane = document.querySelector("#input-pane");
    const previewPane = document.querySelector("#preview-pane");
    const escapeHtml = (value) => String(value)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;");

    const setStatus = (text, ok, where) => {
      const slots = { top: status, editor: editorStatus, bank: bankStatus };
      Object.values(slots).forEach((el) => {
        el.textContent = "";
        el.className = "status";
      });
      const slot = slots[where] || slots[
        state.mode === "batch" ? "top" : (state.editing != null ? "editor" : "bank")
      ];
      slot.textContent = text;
      slot.className = `status ${ok ? "ok" : "bad"}`;
    };

    const confirmLeave = () => !state.dirty || window.confirm("题目尚未保存，确定离开？");

    const leaveEditor = () => {
      if (state.editing == null) return true;
      if (!confirmLeave()) return false;
      state.dirty = false;
      closeEditor();
      return true;
    };

    const markDirty = () => {
      if (state.editing == null) return;
      state.dirty = true;
    };

    const sameText = (left, right) => String(left).trim() === String(right).trim();

    const renderChoices = (item) => {
      const type = String(item.type || "0");
      const answers = (item.answers || []).map((answer) => String(answer).trim()).filter(Boolean);
      const options = (item.options || []).map((option) => String(option).trim()).filter(Boolean);
      if (type === "4") return `<div class="essay-answer">${escapeHtml(answers.join("\n") || "暂无答案")}</div>`;
      if (type === "2") {
        return answers.map((answer, index) => `
          <div class="choice is-answer">
            <span class="choice-letter">${index + 1}</span>
            <span class="choice-text">${escapeHtml(answer)}</span>
          </div>
        `).join("");
      }
      const rows = options.length ? options : answers;
      return rows.map((option, index) => {
        const correct = answers.some((answer) => sameText(answer, option));
        return `
          <div class="choice ${correct ? "is-answer" : ""}">
            <span class="choice-letter">${LETTERS[index] || index + 1}</span>
            <span class="choice-text">${escapeHtml(option)}</span>
          </div>
        `;
      }).join("");
    };

    const questionNo = (item, fallback) => {
      const no = String(item.no || fallback || "").trim();
      return no ? `${no}. ` : "";
    };

    const answerSummary = (item) => {
      const answers = (item.answers || []).map((answer) => String(answer).trim()).filter(Boolean);
      return answers.length ? answers.join(" / ") : "暂无答案";
    };

    const questionCard = (item, extra = "", fallbackNo = "") => `
      <article class="item type-${escapeHtml(String(item.type || "0"))}">
        <div class="item-head">
          <span class="type-badge">${escapeHtml(typeName[item.type] || item.type || "")}</span>
          <b>${escapeHtml(questionNo(item, fallbackNo) + item.title)}</b>
          ${extra}
        </div>
        <div class="choices">${renderChoices(item)}</div>
      </article>
    `;

    const bankItem = (item, index, fallbackNo) => {
      const open = state.open.has(index);
      const type = String(item.type || "0");
      return `
        <article class="item type-${escapeHtml(type)}${open ? " is-open" : ""}${state.editing === index ? " is-editing" : ""}${state.probeIndex === index ? (state.probeHit ? " is-probe" : " is-probe-near") : ""}" data-index="${index}">
          <div class="bank-row" title="${open ? "点击收起" : "点击展开选项"}">
            <span class="type-badge">${escapeHtml(typeName[item.type] || item.type || "")}</span>
            <div class="bank-main">
              <b class="bank-title">${escapeHtml(questionNo(item, fallbackNo) + item.title)}</b>
              <span class="bank-answer">答案：${escapeHtml(answerSummary(item))}</span>
            </div>
            <div class="actions">
              <button type="button" class="ghost tiny" data-edit="${index}">编辑</button>
              <button type="button" class="danger tiny" data-index="${index}">删除</button>
            </div>
          </div>
          <div class="choices">${renderChoices(item)}</div>
        </article>
      `;
    };

    const parseInput = (text) => {
      const trimmed = text.trim();
      if (!trimmed) return [];
      if (trimmed.startsWith("{") || trimmed.startsWith("[")) {
        const parsed = JSON.parse(trimmed);
        const items = Array.isArray(parsed) ? parsed : parsed.questions;
        if (!Array.isArray(items)) throw new Error("JSON 需要 questions 数组");
        return items;
      }
      return ExamParse.parseExamText(trimmed);
    };

    const renderPreview = () => {
      const filled = Boolean(batchInput.value.trim());
      inputPane.classList.toggle("watermark", !filled);
      previewPane.classList.toggle("watermark", !state.preview.length);
      const count = document.querySelector("#preview-count");
      count.innerHTML = `总计输入 <b class="${state.preview.length ? "count-ok" : "count-zero"}">${state.preview.length}</b> 道`;
      preview.innerHTML = state.preview.map((item, index) => questionCard(item, "", index + 1)).join("")
        || (filled ? "<p class='hint'>没有识别到题目，点「格式案例说明」对照格式。</p>" : "");
    };

    const detectFormat = (silent = false) => {
      try {
        state.preview = parseInput(batchInput.value);
        renderPreview();
        if (!silent) {
          setStatus(state.preview.length ? `已识别 ${state.preview.length} 道题` : "没有识别到题目", Boolean(state.preview.length), "top");
        }
      } catch (error) {
        state.preview = [];
        renderPreview();
        if (!silent) setStatus(error.message, false, "top");
      }
    };

    const closeEditor = () => {
      state.editing = null;
      state.dirty = false;
      bankEditor.hidden = true;
      bankBody.classList.remove("is-editing");
    };

    const mountForm = () => {
      if (state.mode === "bank" && state.editing != null) {
        bankEditor.appendChild(form);
        form.hidden = false;
        bankEditor.hidden = false;
        bankBody.classList.add("is-editing");
        return;
      }
      form.hidden = true;
    };

    const fillFromQuestion = (item) => {
      const type = String(item.type || "0");
      state.type = type;
      document.querySelector("#title").value = item.title || "";
      if (type === "0" || type === "1") {
        const options = (item.options || []).map((option) => String(option));
        const answers = item.answers || [];
        const rows = (options.length ? options : answers).map((text) => ({
          text,
          correct: answers.some((answer) => sameText(answer, text))
        }));
        state.options = rows.length >= 2 ? rows : [{ text: "", correct: true }, { text: "", correct: false }];
      } else if (type === "3") {
        state.judge = sameText(item.answers?.[0], "错误") ? "错误" : "正确";
      } else if (type === "2") {
        const answers = (item.answers || []).map((answer) => String(answer));
        state.blanks = answers.length ? answers : [""];
      } else {
        state.essay = (item.answers || []).join("\n");
      }
      renderTypeFields();
    };

    const openEditor = (target) => {
      if (state.editing === target && target !== "new") {
        document.querySelector("#title").focus();
        return;
      }
      if (state.editing != null && state.dirty && !confirmLeave()) return;
      state.editing = target;
      state.dirty = false;
      if (target === "new") {
        document.querySelector("#editor-heading").textContent = "新增题目";
        resetForm();
      } else {
        document.querySelector("#editor-heading").textContent = "编辑题目";
        fillFromQuestion(state.questions[target]);
      }
      mountForm();
      renderList();
      setStatus("", true, "editor");
      document.querySelector("#title").focus();
    };

    const renderMode = () => {
      document.querySelectorAll("#mode-tabs button").forEach((button) => {
        button.setAttribute("aria-pressed", String(button.dataset.mode === state.mode));
      });
      document.querySelector("#batch-view").hidden = state.mode !== "batch";
      document.querySelector("#bank-view").hidden = state.mode !== "bank";
      document.querySelector("#commit").hidden = state.mode !== "batch";
      document.querySelector("#add-question").hidden = state.mode !== "bank";
      if (state.mode !== "bank") closeEditor();
      mountForm();
      const hash = `#${state.mode}`;
      if (location.hash !== hash) history.replaceState(null, "", hash);
    };

    const renderTabs = () => {
      document.querySelectorAll("#type-tabs button").forEach((button) => {
        button.setAttribute("aria-pressed", String(button.dataset.type === state.type));
      });
      document.querySelector("#rule").textContent = rules[state.type];
    };

    const renderChoice = (multiple) => {
      const rows = state.options.map((option, index) => `
        <div class="option-row">
          <input class="mark" type="${multiple ? "checkbox" : "radio"}" name="correct" ${option.correct ? "checked" : ""} data-index="${index}">
          <input type="text" value="${escapeHtml(option.text)}" placeholder="选项 ${index + 1}" data-text="${index}">
          <button type="button" class="ghost tiny" data-remove="${index}">删除</button>
        </div>
      `).join("");
      fields.innerHTML = `${rows}<button type="button" class="ghost" id="add-option">添加选项</button>`;
    };

    const renderTypeFields = () => {
      renderTabs();
      if (state.type === "0" || state.type === "1") return renderChoice(state.type === "1");
      if (state.type === "3") {
        fields.innerHTML = `
          <div class="judge-row">
            <label class="judge-option">
              <input type="radio" name="judge" value="正确" ${state.judge === "正确" ? "checked" : ""}>
              <span class="choice-letter">A</span>
              <span>正确</span>
            </label>
            <label class="judge-option">
              <input type="radio" name="judge" value="错误" ${state.judge === "错误" ? "checked" : ""}>
              <span class="choice-letter">B</span>
              <span>错误</span>
            </label>
          </div>`;
        return;
      }
      if (state.type === "2") {
        fields.innerHTML = state.blanks.map((blank, index) => `
          <div class="blank-row">
            <span>第 ${index + 1} 空</span>
            <input type="text" value="${escapeHtml(blank)}" placeholder="这一空的答案" data-blank="${index}">
            <button type="button" class="ghost tiny" data-remove-blank="${index}">删除</button>
          </div>
        `).join("") + `<button type="button" class="ghost" id="add-blank">添加空</button>`;
        return;
      }
      fields.innerHTML = `<label for="essay">参考答案</label><textarea id="essay">${escapeHtml(state.essay)}</textarea>`;
    };

    const collectPayload = () => {
      const title = document.querySelector("#title").value.trim();
      if (!title) throw new Error("请填写题干");
      if (state.type === "0" || state.type === "1") {
        const optionInputs = [...fields.querySelectorAll("[data-text]")];
        const marks = [...fields.querySelectorAll(".mark")];
        const options = optionInputs.map((input) => input.value.trim()).filter(Boolean);
        const answers = optionInputs
          .filter((input, index) => marks[index]?.checked && input.value.trim())
          .map((input) => input.value.trim());
        if (options.length < 2) throw new Error("至少填写 2 个选项");
        if (state.type === "0" && answers.length !== 1) throw new Error("单选必须点选 1 个正确答案");
        if (state.type === "1" && answers.length < 1) throw new Error("多选至少勾选 1 个正确答案");
        return { title, type: state.type, options, answers };
      }
      if (state.type === "3") {
        const judge = fields.querySelector("input[name='judge']:checked")?.value || state.judge;
        return { title, type: "3", options: ["正确", "错误"], answers: [judge] };
      }
      if (state.type === "2") {
        const answers = [...fields.querySelectorAll("[data-blank]")]
          .map((input) => input.value.trim())
          .filter(Boolean);
        if (!answers.length) throw new Error("至少填写 1 个空");
        return { title, type: "2", options: [], answers };
      }
      const essay = (document.querySelector("#essay")?.value || "").trim();
      if (!essay) throw new Error("请填写简答答案");
      return { title, type: "4", options: [], answers: [essay] };
    };

    const resetForm = () => {
      document.querySelector("#title").value = "";
      state.options = [{ text: "", correct: true }, { text: "", correct: false }];
      state.blanks = [""];
      state.judge = "正确";
      state.essay = "";
      renderTypeFields();
    };

    const filteredQuestions = () => {
      const query = state.query.trim().toLowerCase();
      return state.questions.map((item, index) => ({ item, index })).filter(({ item }) => {
        if (state.filterType !== "all" && String(item.type) !== state.filterType) return false;
        if (!query) return true;
        return `${item.title} ${(item.options || []).join(" ")} ${(item.answers || []).join(" ")}`.toLowerCase().includes(query);
      });
    };

    const renderList = () => {
      if (state.probeIndex != null && (state.probeIndex < 0 || state.probeIndex >= state.questions.length)) {
        state.probeIndex = null;
        state.probeHit = false;
      }
      const rows = filteredQuestions();
      const counts = { all: state.questions.length, "0": 0, "1": 0, "2": 0, "3": 0, "4": 0 };
      state.questions.forEach((item) => {
        const type = String(item.type || "0");
        if (counts[type] != null) counts[type] += 1;
      });
      document.querySelector("#bank-tab").textContent = `当前题库 (${state.questions.length})`;
      document.querySelector("#page-info").textContent = rows.length
        ? `共 ${rows.length} 题`
        : (state.questions.length ? "没有匹配的题目" : "还没有题目");
      document.querySelectorAll("#type-filters button").forEach((button) => {
        const filter = button.dataset.filter;
        const label = filter === "all" ? "全部" : typeName[filter];
        button.textContent = `${label} ${counts[filter] ?? 0}`;
        button.setAttribute("aria-pressed", String(filter === state.filterType));
      });
      list.innerHTML = rows.map(({ item, index }) => bankItem(item, index, index + 1)).join("")
        || `<p class="hint">${state.questions.length ? "没有匹配的题目。" : "还没有题目。"}</p>`;
    };

    const showProbeResult = (hit, html, text = "") => {
      const box = document.querySelector("#probe-result");
      box.hidden = false;
      box.className = `probe-result ${hit ? "is-hit" : "is-miss"}`;
      if (html) box.innerHTML = html;
      else box.textContent = text;
    };

    const revealProbed = () => {
      if (state.probeIndex == null) return;
      let row = list.querySelector(`.item[data-index="${state.probeIndex}"]`);
      if (!row) {
        state.filterType = "all";
        state.query = "";
        document.querySelector("#search").value = "";
        renderList();
        row = list.querySelector(`.item[data-index="${state.probeIndex}"]`);
      }
      if (!row) return;
      state.open.add(state.probeIndex);
      row.classList.add("is-open");
      const heading = row.querySelector(".bank-row");
      if (heading) heading.title = "点击收起";
      row.scrollIntoView({ block: "nearest" });
    };

    const runProbe = async () => {
      const title = document.querySelector("#probe-input").value.trim();
      if (!title) {
        state.probeIndex = null;
        state.probeHit = false;
        renderList();
        showProbeResult(false, "", "请填写题干");
        return;
      }
      try {
        const result = await (await fetch("/probe", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ question: title })
        })).json();
        state.probeIndex = Number.isInteger(result.index) && result.index >= 0 ? result.index : null;
        state.probeHit = Boolean(result.matched);
        const question = result.question;
        if (!question) {
          showProbeResult(false, "", result.msg || "未命中");
        } else {
          const kind = typeName[question.type] || "";
          const answers = (question.answers || []).join(" / ") || "暂无答案";
          const html = result.matched
            ? `<strong>${escapeHtml(result.msg)}</strong><span>${escapeHtml(kind)} ${escapeHtml(question.title)}</span><span>答案：${escapeHtml(answers)}</span>`
            : `<strong>${escapeHtml(result.msg)}</strong><span>最接近：${escapeHtml(kind)} ${escapeHtml(question.title)}</span>`;
          showProbeResult(result.matched, html);
        }
        renderList();
        revealProbed();
      } catch (error) {
        state.probeIndex = null;
        state.probeHit = false;
        showProbeResult(false, "", error.message || "试搜失败");
      }
    };

    const loadQuestions = async () => {
      state.questions = await (await fetch("/questions")).json();
      renderList();
    };

    const importQuestions = async (items) => {
      const result = await (await fetch("/questions/import", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ questions: items })
      })).json();
      if (result.code !== 200) throw new Error(result.msg || "导入失败");
      await loadQuestions();
      return result.msg || "导入完成";
    };

    document.querySelector("#mode-tabs").addEventListener("click", (event) => {
      const button = event.target.closest("button[data-mode]");
      if (!button) return;
      const next = button.dataset.mode;
      if (next === state.mode) return;
      if (state.mode === "bank" && !leaveEditor()) return;
      state.mode = next;
      renderMode();
    });
    window.addEventListener("hashchange", () => {
      if (location.hash.slice(1) === "single") {
        if (state.mode === "bank" && state.editing != null && state.dirty && !confirmLeave()) {
          history.replaceState(null, "", `#${state.mode}`);
          return;
        }
        state.dirty = false;
        state.mode = "bank";
        renderMode();
        openEditor("new");
        return;
      }
      const mode = readMode();
      if (mode === state.mode) return;
      if (state.mode === "bank" && !leaveEditor()) {
        history.replaceState(null, "", `#${state.mode}`);
        return;
      }
      state.mode = mode;
      renderMode();
    });

    document.querySelector("#quick-input").addEventListener("click", () => {
      batchInput.value = ExamParse.SAMPLE_TEXT;
      detectFormat();
    });

    document.querySelector("#clear-input").addEventListener("click", () => {
      batchInput.value = "";
      state.preview = [];
      renderPreview();
      setStatus("", true, "top");
    });

    document.querySelector("#detect").addEventListener("click", () => detectFormat(false));
    let detectTimer = 0;
    batchInput.addEventListener("input", () => {
      inputPane.classList.toggle("watermark", !batchInput.value.trim());
      window.clearTimeout(detectTimer);
      detectTimer = window.setTimeout(() => detectFormat(true), 280);
    });

    document.querySelector("#commit").addEventListener("click", async () => {
      try {
        if (!state.preview.length) detectFormat();
        if (!state.preview.length) throw new Error("检查区还没有题目");
        const msg = await importQuestions(state.preview);
        batchInput.value = "";
        state.preview = [];
        renderPreview();
        state.mode = "bank";
        renderMode();
        setStatus(msg, true, "bank");
      } catch (error) {
        setStatus(error.message, false, "top");
      }
    });

    document.querySelector("#show-help").addEventListener("click", () => {
      document.querySelector("#help-sample").innerHTML = `<b>试题案例</b>\n${escapeHtml(ExamParse.SAMPLE_TEXT)}`;
      document.querySelector("#help-modal").classList.add("open");
    });
    document.querySelector("#close-help").addEventListener("click", () => {
      document.querySelector("#help-modal").classList.remove("open");
    });
    document.querySelector("#help-modal").addEventListener("click", (event) => {
      if (event.target.id === "help-modal") event.currentTarget.classList.remove("open");
    });

    document.querySelector("#type-tabs").addEventListener("click", (event) => {
      const button = event.target.closest("button[data-type]");
      if (!button) return;
      state.type = button.dataset.type;
      if ((state.type === "0" || state.type === "1") && state.options.length < 2) {
        state.options = [{ text: "", correct: true }, { text: "", correct: false }];
      }
      markDirty();
      renderTypeFields();
    });

    document.querySelector("#title").addEventListener("input", markDirty);

    fields.addEventListener("input", (event) => {
      if (event.target.dataset.text != null) state.options[Number(event.target.dataset.text)].text = event.target.value;
      if (event.target.dataset.blank != null) state.blanks[Number(event.target.dataset.blank)] = event.target.value;
      if (event.target.id === "essay") state.essay = event.target.value;
      markDirty();
    });

    fields.addEventListener("change", (event) => {
      if (event.target.name === "judge") {
        state.judge = event.target.value;
        markDirty();
        return;
      }
      if (event.target.name !== "correct") return;
      markDirty();
      if (state.type === "0") {
        state.options.forEach((item, index) => {
          item.correct = String(index) === event.target.dataset.index;
        });
        return;
      }
      state.options[Number(event.target.dataset.index)].correct = event.target.checked;
    });

    fields.addEventListener("click", (event) => {
      if (event.target.id === "add-option") {
        state.options.push({ text: "", correct: false });
        markDirty();
        renderTypeFields();
        return;
      }
      if (event.target.id === "add-blank") {
        state.blanks.push("");
        markDirty();
        renderTypeFields();
        return;
      }
      if (event.target.dataset.remove != null && state.options.length > 2) {
        state.options.splice(Number(event.target.dataset.remove), 1);
        if (state.type === "0" && !state.options.some((item) => item.correct)) state.options[0].correct = true;
        markDirty();
        renderTypeFields();
      }
      if (event.target.dataset.removeBlank != null && state.blanks.length > 1) {
        state.blanks.splice(Number(event.target.dataset.removeBlank), 1);
        markDirty();
        renderTypeFields();
      }
    });

    document.querySelector("#form").addEventListener("submit", async (event) => {
      event.preventDefault();
      try {
        const payload = collectPayload();
        const editing = state.editing;
        const isUpdate = state.mode === "bank" && Number.isInteger(editing);
        const result = await (await fetch("/questions", {
          method: isUpdate ? "PUT" : "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(isUpdate ? { ...payload, index: editing } : payload)
        })).json();
        if (result.code !== 200) throw new Error(result.msg || "保存失败");
        await loadQuestions();
        closeEditor();
        mountForm();
        renderList();
        setStatus(isUpdate ? "已更新" : "已保存", true, "bank");
      } catch (error) {
        setStatus(error.message, false, "editor");
      }
    });

    document.querySelector("#reset").addEventListener("click", () => {
      resetForm();
      markDirty();
      setStatus("", true, "editor");
    });

    document.querySelector("#search").addEventListener("input", (event) => {
      state.query = event.target.value;
      renderList();
    });

    document.querySelector("#probe").addEventListener("click", () => {
      runProbe().catch((error) => showProbeResult(false, "", error.message || "试搜失败"));
    });
    document.querySelector("#probe-input").addEventListener("keydown", (event) => {
      if (event.key !== "Enter") return;
      event.preventDefault();
      runProbe().catch((error) => showProbeResult(false, "", error.message || "试搜失败"));
    });
    document.querySelector("#probe-result").addEventListener("click", () => revealProbed());

    document.querySelector("#type-filters").addEventListener("click", (event) => {
      const button = event.target.closest("button[data-filter]");
      if (!button) return;
      state.filterType = button.dataset.filter;
      renderList();
    });

    document.querySelector("#expand-all").addEventListener("click", () => {
      filteredQuestions().forEach(({ index }) => state.open.add(index));
      renderList();
    });

    document.querySelector("#collapse-all").addEventListener("click", () => {
      filteredQuestions().forEach(({ index }) => state.open.delete(index));
      renderList();
    });

    document.querySelector("#add-question").addEventListener("click", () => openEditor("new"));
    document.querySelector("#close-editor").addEventListener("click", () => {
      if (!leaveEditor()) return;
      mountForm();
      renderList();
    });

    list.addEventListener("click", async (event) => {
      const edit = event.target.closest("button[data-edit]");
      if (edit) {
        openEditor(Number(edit.dataset.edit));
        return;
      }
      const remove = event.target.closest("button[data-index]");
      if (remove) {
        const deleted = Number(remove.dataset.index);
        const item = state.questions[deleted];
        const label = String(item?.title || "这道题").trim().slice(0, 40);
        if (!window.confirm(`确定删除「${label}」？`)) return;
        const result = await (await fetch("/questions", {
          method: "DELETE",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ index: deleted })
        })).json();
        if (result.code !== 200) {
          setStatus(result.msg || "删除失败", false, "bank");
          return;
        }
        const next = new Set();
        state.open.forEach((index) => {
          if (index < deleted) next.add(index);
          if (index > deleted) next.add(index - 1);
        });
        state.open = next;
        if (state.editing === deleted) closeEditor();
        else if (Number.isInteger(state.editing) && state.editing > deleted) state.editing -= 1;
        if (state.probeIndex === deleted) {
          state.probeIndex = null;
          state.probeHit = false;
        } else if (Number.isInteger(state.probeIndex) && state.probeIndex > deleted) {
          state.probeIndex -= 1;
        }
        await loadQuestions();
        mountForm();
        setStatus("已删除", true, "bank");
        return;
      }
      if (event.target.closest(".actions")) return;
      const row = event.target.closest(".bank-row");
      if (!row) return;
      const item = row.closest(".item[data-index]");
      if (!item) return;
      const index = Number(item.dataset.index);
      if (state.open.has(index)) state.open.delete(index);
      else state.open.add(index);
      item.classList.toggle("is-open", state.open.has(index));
      row.title = state.open.has(index) ? "点击收起" : "点击展开选项";
    });

    window.addEventListener("beforeunload", (event) => {
      if (!state.dirty) return;
      event.preventDefault();
      event.returnValue = "";
    });

    renderMode();
    renderTypeFields();
    renderPreview();
    loadQuestions()
      .then(() => {
        if (startWithNew) openEditor("new");
      })
      .catch(() => setStatus("题库服务未启动", false, "top"));
  </script>
</body>
</html>
